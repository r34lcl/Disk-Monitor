<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disk Monitor</title><link rel="icon" href="/favicon.svg">
<style>
:root{color-scheme:light dark;--bg:#F1F5F9;--card:#FFFFFF;--card2:#E9EEF4;--text:#0F172A;--text2:#334155;--muted:#5B677A;--border:#DDE3EA;
--accent:#2563EB;--accent-ink:#FFFFFF;--series:#2a78d6;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--grid:#E6EBF1;
--good-ink:#067306;--warn-ink:#8a5a00;--crit-ink:#b02a2a;--ring:#2563EB;--header:rgba(241,245,249,.82)}
@media (prefers-color-scheme:dark){:root{--bg:#0F172A;--card:#1B2336;--card2:#272F42;--text:#F8FAFC;--text2:#CBD5E1;--muted:#94A3B8;
--border:#334155;--accent:#2563EB;--series:#3987e5;--grid:#2A3448;--good-ink:#4ADE80;--warn-ink:#FBBF24;--crit-ink:#F87171;
--ring:#93C5FD;--header:rgba(15,23,42,.82)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--header);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px}
.brand small{font-weight:400;color:var(--muted)}
.lang{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.lang svg{width:15px;height:15px;margin:0 3px 0 5px;color:var(--muted);flex:none}
.lang button{border:0;background:transparent;color:var(--text2);font:inherit;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;cursor:pointer;min-height:24px}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff}
.lang button:not([aria-pressed=true]):hover{background:var(--card2);color:var(--text)}
.lang button:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav button,.btn{background:transparent;border:1px solid transparent;color:var(--text2);padding:6px 11px;border-radius:7px;cursor:pointer;font:inherit}
nav button.on{background:var(--card);border-color:var(--border);color:var(--text)}
.btn{border-color:var(--border);background:var(--card);color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px;min-height:28px}
.btn,nav button,.seg button,.disk{transition:border-color .15s,background-color .15s,color .15s}
:is(.btn,nav button,.seg button,.disk,summary,a,input,select,textarea):focus-visible{outline:2px solid var(--ring);outline-offset:2px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
nav button,.btn,.seg button,summary{cursor:pointer;min-height:30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.ico{width:18px;height:18px;flex:none;margin-top:1px}
.stale{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--text)}
.btn:disabled{opacity:.55;cursor:default}
main.wrap{padding-top:28px;padding-bottom:72px}
@media (max-width:640px){main.wrap{padding-top:20px;padding-bottom:48px}}
h2{font-size:15px;margin:26px 0 10px;font-weight:650;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:0}
.muted{color:var(--muted)}.t2{color:var(--text2)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.bar .grow{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.disk{cursor:pointer;transition:border-color .15s;position:relative}
.disk:hover{border-color:var(--muted)}
.disk.h-critical{border-left:4px solid var(--crit)}.disk.h-warning{border-left:4px solid var(--warn)}
.dhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dname{font-weight:650;font-size:15px}
.dmodel{color:var(--text2);font-size:12.5px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--border)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.p-ok{color:var(--good-ink)}.p-ok .dot{background:var(--good)}
.p-warning{color:var(--warn-ink)}.p-warning .dot{background:var(--warn)}
.p-critical{color:var(--crit-ink)}.p-critical .dot{background:var(--crit)}
.p-info,.p-ignored,.p-unknown,.p-standby,.p-nosmart,.p-missing{color:var(--text2)}.p-info .dot{background:var(--accent)}.p-ignored .dot,.p-unknown .dot,.p-standby .dot,.p-nosmart .dot{background:var(--muted)}.p-missing .dot{background:var(--crit)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--card2);color:var(--text2)}
.trow{display:flex;align-items:flex-end;gap:14px;margin:12px 0 8px}
.temp{font-size:28px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.temp small{font-size:14px;font-weight:500;color:var(--text2)}
.spark{flex:1;height:38px;min-width:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;font-size:12.5px;margin-top:6px}
.kv div{min-width:0}.kv b{display:block;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv span{color:var(--muted)}
.bad b{color:var(--crit-ink)}
.foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meter{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;border-radius:4px;background:var(--series)}
.meter i.warning{background:var(--warn)}.meter i.critical{background:var(--crit)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);margin-bottom:6px}
.alert .txt{flex:1;min-width:0}.alert .txt div:first-child{font-weight:550}
.alert.acked{opacity:.6}
.sevicon{font-size:15px;line-height:1.3}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-weight:600;color:var(--text2);font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.hl td{background:color-mix(in srgb,var(--crit) 12%,transparent)}
tr.wl td{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tw{overflow-x:auto}
body{min-height:100vh;display:flex;flex-direction:column}main.wrap{flex:1 0 auto;width:100%}
footer.site{border-top:1px solid var(--border);padding:16px;text-align:center;font-size:12.5px;color:var(--muted)}
footer.site a{color:inherit;text-decoration:none;font-weight:600}footer.site a:hover{color:var(--text);text-decoration:underline}
.card table tbody tr:last-child td{border-bottom:0}
.card.tw{padding:8px 14px 12px}
.vdev{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
dialog{border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);padding:0;width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:#0008}
.dlg-h{position:sticky;top:0;background:var(--bg);padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;z-index:2}
.dlg-b{padding:20px 18px 28px}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px;font-size:13px}
.info span{display:block;color:var(--muted);font-size:12px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:220px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px #0003;display:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--text2);padding:4px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.seg button.on{background:var(--accent);color:#fff}
form.cfg{display:grid;gap:14px}
fieldset{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--card);margin:0}
legend{font-weight:650;padding:0 6px}
.fr{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 16px}
.f label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f input[type=text],.f input[type=number],.f input[type=password],.f select,.f textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:inherit;font:inherit}
.f textarea{min-height:80px;font-family:ui-monospace,monospace;font-size:12.5px}
.chk{display:flex;gap:7px;align-items:center;font-size:13.5px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.job{display:grid;grid-template-columns:auto 120px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)}
.job:last-child{border-bottom:0}
.disks-sel{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;margin-top:6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;display:none;z-index:20;max-width:calc(100vw - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px}
.prog{font-size:12px;color:var(--accent);font-weight:600}
.task{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.task.off{opacity:.72}.task.off .tname{color:var(--text2)}
.task-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.task-h .grow{flex:1;min-width:220px}
.tname{font-weight:650;font-size:15px}
.tdesc{color:var(--text2);font-size:13px;margin-top:2px}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:9px;font-size:13px}
.tmeta span{color:var(--muted)}
.tlast.bad{color:var(--crit-ink)}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text2);margin-top:1px}
.sw input{position:absolute;opacity:0;width:38px;height:22px;margin:0;cursor:pointer}
.sw i{width:38px;height:22px;border-radius:11px;background:var(--card2);border:1px solid var(--border);position:relative;flex:none;transition:background-color .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background-color .15s}
.sw input:checked+i{background:var(--accent);border-color:var(--accent)}.sw input:checked+i::after{transform:translateX(16px);background:#fff}
.sw input:focus-visible+i{outline:2px solid var(--ring);outline-offset:2px}
.ted{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:grid;gap:12px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{min-width:42px;min-height:32px;border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
.days button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.days button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.prev{font-size:13px;color:var(--text2);background:var(--card2);border-radius:7px;padding:8px 10px}
.prev b{color:var(--text)}
.f input[type=time]{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:inherit;font:inherit}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));margin-bottom:14px;font-size:13px}
.note code,.ted code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.addmenu{display:flex;gap:6px;flex-wrap:wrap}
.scrub{margin:2px 0 10px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scrub .grow{flex:1;min-width:180px}
@media (max-width:640px){.kv{grid-template-columns:repeat(2,1fr)}.job{grid-template-columns:1fr}nav{margin-left:0;width:100%}}
</style></head><body>
<header><div class="wrap top">
  <div class="brand"><img src="/favicon.svg" width="24" alt=""><span>Disk Monitor <small id="srv"></small></span></div>
  <div class="lang" role="group" aria-label="Idioma / Language"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M2 10h16M10 2c2.2 2.3 3.2 5 3.2 8s-1 5.7-3.2 8c-2.2-2.3-3.2-5-3.2-8s1-5.7 3.2-8z"/></svg><button type="button" data-lang="es" aria-pressed="true" title="Español" onclick="setLanguage('es')">ES</button><button type="button" data-lang="en" aria-pressed="false" title="English" onclick="setLanguage('en')">EN</button></div>
  <nav id="nav">
    <button data-v="panel" class="on" data-t>Panel</button><button data-v="alerts" data-t>Alertas</button>
    <button data-v="tasks" data-t>Tareas</button><button data-v="log" data-t>Actividad</button><button data-v="cfg" data-t>Configuración</button>
    <button onclick="logout()" title="Cerrar sesión" data-tt data-t>Salir</button>
  </nav>
</div></header>
<main class="wrap">
  <section id="v-panel"></section>
  <section id="v-alerts" hidden></section>
  <section id="v-tasks" hidden></section>
  <section id="v-log" hidden></section>
  <section id="v-cfg" hidden></section>
</main>
<footer class="site">Disk Monitor <span id="ver"></span> · <a href="https://kqk.cl" target="_blank" rel="noopener">KqK.cl</a></footer>
<dialog id="dlg"><div class="dlg-h"><div id="dlg-t" style="flex:1;font-weight:650"></div><button class="btn sm" onclick="dlg.close()" aria-label="Cerrar detalle" data-t>Cerrar</button></div><div class="dlg-b" id="dlg-b"></div></dialog>
<div id="toast"></div>
<script src="/i18n.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// literal JS seguro dentro de un atributo on*="…": JSON (contexto JS) y luego esc (contexto HTML)
const jsq=s=>esc(JSON.stringify(String(s??"")));
let ST=null,CFG=null,TK=null,EDIT=null,VIEW="panel";
async function api(path,opt={}){
  const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){location.href="/login";throw new Error("no autenticado")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||("HTTP "+r.status));
  return j;
}
function toast(m,ms=3500){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ms)}
const fmtB=n=>{if(n==null)return"—";const u=["B","KB","MB","GB","TB","PB"];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return(i?n.toFixed(n<10?2:1):n)+" "+u[i]};
const fmtN=n=>n==null?"—":Number(n).toLocaleString(LOC);
const fmtT=t=>t?new Date(t*1000).toLocaleString(LOC,{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
function ago(t){if(!t)return _t("nunca");const s=Date.now()/1000-t,a=Math.abs(s);let v;
  if(a<60)v=Math.round(a)+" s";else if(a<3600)v=Math.round(a/60)+" min";else if(a<86400)v=(a/3600).toFixed(1).replace(".0","")+" h";else{const n=Math.round(a/86400);v=n+(n===1?_t(" día"):_t(" días"))}
  return _t(s>=0?"hace {v}":"en {v}",{v})}
const years=h=>h==null?"—":(h>=8760?(h/8760).toFixed(1)+_t(" años"):Math.round(h/24)+_t(" días"));
const SEVL={nosmart:"Sin SMART",ok:"Sano",warning:"Aviso",critical:"Crítico",info:"Info",ignored:"Ignorado",unknown:"Sin datos",standby:"En reposo"};
const SEVI={ok:"✓",warning:"!",critical:"✕",info:"i",ignored:"–",unknown:"?"};
const pill=(lvl,txt)=>`<span class="pill p-${lvl}"><span class="dot"></span>${esc(txt||_t(SEVL[lvl]||lvl))}</span>`;
const ICON={
 critical:`<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--crit)"/><path d="M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
 warning:`<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8l8.6 15.4H1.4z" fill="var(--warn)" stroke="var(--warn)" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 7.2v4.6" stroke="#1f1500" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14.5" r="1.15" fill="#1f1500"/></svg>`,
 info:`<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--accent)"/><path d="M10 9v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="6" r="1.2" fill="#fff"/></svg>`,
 ok:`<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--good)"/><path d="M6 10.4l2.7 2.6L14 7.6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const icon=sev=>ICON[sev]||ICON.info;

document.querySelectorAll("#nav button[data-v]").forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){VIEW=v;document.querySelectorAll("#nav button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!=="v-"+v);
  history.replaceState(null,"","#"+v);
  ({panel:loadPanel,alerts:loadAlerts,tasks:loadTasks,log:loadLog,cfg:loadCfg})[v]();}
async function logout(){await fetch("/api/logout",{method:"POST"});location.href="/login"}

// ------------------------------------------------------------------ gráficos (una serie: sin leyenda)
function sparkSVG(pts){
  if(!pts||pts.length<2)return`<svg class="spark" viewBox="0 0 100 38"></svg>`;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-1,y1=Math.max(...ys)+1;
  const W=200,H=38,X=x=>(x-x0)/(x1-x0||1)*W,Y=y=>H-3-(y-y0)/(y1-y0||1)*(H-6);
  const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${_t("Temperatura últimas 24 h")}"><path d="${d}" fill="none" stroke="var(--series)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function lineChart(el,pts,{unit="",refs=[],label=""}={}){
  if(!pts||pts.length<2){el.innerHTML=`<div class="empty">${_t("Aún no hay suficiente historial")}</div>`;return}
  const W=el.clientWidth||800,H=220,L=40,R=12,T=12,B=26;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const rv=refs.map(r=>r.v);let y0=Math.min(...ys),y1=Math.max(...ys);
  // incluir umbrales sólo si están cerca de los datos
  rv.forEach(v=>{if(v<=y1+12&&v>=y0-12){y0=Math.min(y0,v);y1=Math.max(y1,v)}});
  const pad=Math.max(1,(y1-y0)*0.1);y0=Math.floor(y0-pad);y1=Math.ceil(y1+pad);
  const X=x=>L+(x-x0)/(x1-x0||1)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0||1))*(H-T-B);
  const ticks=[];const step=Math.max(1,Math.ceil((y1-y0)/5));for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step)ticks.push(v);
  const span=x1-x0,xt=[];for(let i=0;i<=4;i++)xt.push(x0+span*i/4);
  const xl=t=>{const d=new Date(t*1000);return span>172800?d.toLocaleDateString(LOC,{day:"2-digit",month:"2-digit"}):d.toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"})};
  const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("")}
    ${xt.map(t=>`<text x="${X(t)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${xl(t)}</text>`).join("")}
    ${refs.filter(r=>r.v>=y0&&r.v<=y1).map(r=>`<line x1="${L}" x2="${W-R}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="var(--${r.c})" stroke-dasharray="4 4"/><text x="${W-R-4}" y="${Y(r.v)-4}" text-anchor="end" font-size="11" fill="var(--text2)">${esc(r.t)}</text>`).join("")}
    <path d="${d}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"/>
    <line id="xh" y1="${T}" y2="${H-B}" stroke="var(--muted)" visibility="hidden"/>
    <circle id="xd" r="4" fill="var(--series)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/></svg><div class="tip"></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),xh=svg.querySelector("#xh"),xd=svg.querySelector("#xd");
  const move=e=>{const r=svg.getBoundingClientRect();const mx=(e.clientX-r.left)*W/r.width;
    const tx=x0+(mx-L)/(W-L-R)*(x1-x0);let best=pts[0];for(const p of pts)if(Math.abs(p[0]-tx)<Math.abs(best[0]-tx))best=p;
    const px=X(best[0]),py=Y(best[1]);[xh,xd].forEach(n=>n.setAttribute("visibility","visible"));

}

    if(!ssd)add("Incorregibles",fmtN(c.offline_uncorrectable),c.offline_uncorrectable>0);else add("Bloques malos",fmtN(c.grown_bad_blocks),c.grown_bad_blocks>0);

    <div class="fr" style="margin-top:12px"><div class="f"><label for="disc_min">${_t("Cada (minutos)")}</label><input id="disc_min" type="number" min="0" max="1440" value="${j.discovery_minutes}"><div class="hint">${_t("0 = desactivada")}</div></div>
</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px">${C("skip_standby","No despertar discos en reposo al revisar (usa la última lectura)",j.skip_standby)}
    <button class="btn sm" onclick="saveSys()">${_t("Guardar")}</button></div></div>`;
  $("#v-tasks").innerHTML=h;
  if(EDIT!==null)wPreview(EDIT)}
function taskCard(t,i){
  const L=t.last,ed=EDIT===i,isNew=!t.label;
  const conflict=(t.type==="scrub"||(t.type==="smart"&&t.test==="long"))&&t.enabled&&t.next[0]&&TK.tasks.some(o=>o!==t&&o.enabled&&o.next[0]&&(o.type==="scrub"||(o.type==="smart"&&o.test==="long"))&&o.type!==t.type&&Math.abs(o.next[0]-t.next[0])<86400);
  const running=TK.running_task===t.id,na=t.unavailable;
  return`<div class="task ${t.enabled&&!na?"":"off"}" id="task-${i}"><div class="task-h">
    <label class="sw" title="${t.enabled?_t("Desactivar"):_t("Activar")}"><input type="checkbox" ${t.enabled?"checked":""} ${na?"disabled":""} onchange="toggleTask(${i},this.checked)" aria-label="${esc(t.label||_t("Tarea"))}: ${_t("activa")}"><i></i></label>
    <div class="grow"><div class="tname">${esc(t.label||tlabel(t))}</div><div class="tdesc">${esc(tdesc(t))}</div>
      <div class="tmeta"><div><span>${_t("Horario")}</span> <b>${esc(t.describe||"—")}</b></div>
        <div><span>${_t("Próxima")}</span> <b>${na?_t("inactiva: ")+esc(na):t.enabled?(t.next_h&&t.next_h[0]||"—"):_t("desactivada")}</b></div>
        ${targetsTxt(t)}</div>
      <div class="tmeta">${running?`<div class="prog">${_t("En ejecución…")}</div>`:L?`<div class="tlast ${L.ok?"":"bad"}"><span>${_t("Última")}</span> <b title="${fmtT(L.ts)}">${ago(L.ts)}</b>${L.trigger==="manual"?_t(" (manual)"):""} · ${L.ok?"✓":"✕"} ${esc(L.msg)}</div>`:`<div><span>${_t("Última")}</span> ${_t("nunca")}</div>`}</div>
      ${conflict?`<div class="tmeta" style="color:var(--warn-ink)">${icon("warning")} ${_t("Coincide en menos de 24 h con otra tarea pesada (scrub / prueba larga). Conviene separarlas.")}</div>`:""}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${isNew||na?"":`<button class="btn sm" onclick="runTask(${jsq(t.id)})" ${running||TK.running_task?"disabled":""}>${_t("Ejecutar ahora")}</button>`}<button class="btn sm" onclick="editTask(${ed?"null":i})" aria-expanded="${ed}">${ed?_t("Cerrar"):_t("Editar")}</button></div></div>
    ${ed?taskEditor(t,i):""}</div>`}
function tlabel(t){return _t(t.type==="smart"?(t.test==="long"?"Prueba SMART larga":"Prueba SMART corta"):({check:"Revisión de discos",scrub:"Scrub ZFS",report:"Resumen del estado"})[t.type])}
function targetsTxt(t){if(t.type==="smart"){const n=(t.targets||[]).map(k=>(TK.disks.find(d=>d.key===k)||{}).name||"?");return`<div><span>${_t("Discos")}</span> <b>${n.length?esc(n.join(", ")):_t("todos")}</b></div>`}
  if(t.type==="scrub")return`<div><span>Pools</span> <b>${(t.targets||[]).length?esc(t.targets.join(", ")):_t("todos")}</b></div>`;return""}
function taskEditor(t,i){const w=t.when||{freq:"daily",time:"04:00"};const f=w.freq;
  const opt=(v,l)=>`<option value="${v}" ${f===v?"selected":""}>${_t(l)}</option>`;
  let h=`<div class="ted"><div class="fr">
    <div class="f"><label for="w_freq">${_t("Repetir")}</label><select id="w_freq" onchange="wChange(${i})">${t.type==="check"?opt("interval","Cada cierto tiempo"):""}${opt("daily","Todos los días")}${opt("weekly","Ciertos días de la semana")}${opt("monthly","Una vez al mes (día fijo)")}${opt("monthly_nth","Una vez al mes (p.ej. 2º domingo)")}${t.type!=="check"?opt("interval","Cada cierto tiempo"):""}${opt("cron","Avanzado (cron)")}</select></div>`;
  if(f==="interval")h+=`<div class="f"><label for="w_every">${_t("Cada")}</label><input id="w_every" type="number" min="1" value="${w.every||30}" oninput="wPreview(${i})"></div>
    <div class="f"><label for="w_unit">${_t("Unidad")}</label><select id="w_unit" onchange="wPreview(${i})"><option value="min" ${w.unit!=="h"?"selected":""}>${_t("minutos")}</option><option value="h" ${w.unit==="h"?"selected":""}>${_t("horas")}</option></select></div>`;
  if(f==="monthly")h+=`<div class="f"><label for="w_day">${_t("Día del mes")}</label><input id="w_day" type="number" min="1" max="31" value="${w.day||1}" oninput="wPreview(${i})"><div class="hint">${_t("Del 29 al 31 se salta los meses más cortos")}</div></div>`;
  if(f==="monthly_nth")h+=`<div class="f"><label for="w_nth">${_t("Semana")}</label><select id="w_nth" onchange="wPreview(${i})">${[[1,"Primer"],[2,"Segundo"],[3,"Tercer"],[4,"Cuarto"]].map(([v,l])=>`<option value="${v}" ${w.nth==v?"selected":""}>${_t(l)}</option>`).join("")}</select></div>
    <div class="f"><label for="w_dow">${_t("Día")}</label><select id="w_dow" onchange="wPreview(${i})">${DOWS.map(([v])=>`<option value="${v}" ${w.dow==v?"selected":""}>${_t(DOWN[v])}</option>`).join("")}</select></div>`;
  if(["daily","weekly","monthly","monthly_nth"].includes(f))h+=`<div class="f"><label for="w_time">${_t("Hora")}</label><input id="w_time" type="time" value="${esc(w.time||"04:00")}" oninput="wPreview(${i})"></div>`;
  if(f==="cron")h+=`<div class="f" style="grid-column:span 2"><label for="w_cron">${_t("Expresión cron (minuto hora día mes día-semana)")}</label><input id="w_cron" type="text" value="${esc(w.cron||"0 4 * * *")}" oninput="wPreview(${i})"><div class="hint">${_t("Ojo: si fijas día del mes y día de la semana, cron corre en <b>ambos</b> casos.")}</div></div>`;
  h+=`</div>`;
  if(f==="weekly"){const ds=w.days||[];h+=`<div><div class="hint" style="margin:0 0 5px">${_t("Días")}</div><div class="days" role="group" aria-label="${_t("Días de la semana")}">${DOWS.map(([v,l])=>`<button type="button" aria-pressed="${ds.includes(v)}" data-d="${v}" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true');wPreview(${i})" title="${_t(DOWN[v])}">${_t(l)}</button>`).join("")}</div></div>`}
  h+=`<div class="prev" id="w_prev" aria-live="polite">…</div>`;
  if(t.type==="smart"){h+=`<div class="fr"><div class="f"><label for="t_test">${_t("Tipo de prueba")}</label><select id="t_test"><option value="short" ${t.test!=="long"?"selected":""}>${_t("Corta (1–2 min)")}</option><option value="long" ${t.test==="long"?"selected":""}>${_t("Larga (horas)")}</option></select></div></div>
    <div><div class="hint" style="margin:0 0 5px">${_t("Discos (ninguno marcado = todos)")}</div><div class="disks-sel">${TK.disks.map(d=>`<label class="chk"><input type="checkbox" data-tg value="${esc(d.key)}" ${(t.targets||[]).includes(d.key)?"checked":""}> ${esc(d.label)}</label>`).join("")}</div></div>`}
  if(t.type==="scrub")h+=`<div><div class="hint" style="margin:0 0 5px">${_t("Pools (ninguno marcado = todos)")}</div><div class="disks-sel">${TK.pools.map(p=>`<label class="chk"><input type="checkbox" data-tg value="${esc(p.name)}" ${(t.targets||[]).includes(p.name)?"checked":""}> ${esc(p.name)}</label>`).join("")}</div>
    <div class="hint">${_t("Si el pool está degradado o ya tiene un scrub o resilver en curso, no se inicia.")}</div></div>`;
  if(t.type==="scrub")h+=C("t_nstart","Avisar cuando empieza (con la hora estimada de término)",t.notify_start!==false);
  if(t.type==="smart"||t.type==="scrub")h+=C("t_notify",`Avisar también cuando termina sin problemas <span class="muted">(si encuentra errores, avisa siempre)</span>`,t.notify_ok);
  h+=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" onclick="saveTask(${i})">${_t("Guardar")}</button><button class="btn sm" onclick="editTask(null)">${_t("Cancelar")}</button>
    ${t.type!=="check"?`<button class="btn sm" style="margin-left:auto;color:var(--crit-ink)" onclick="delTask(${i})">${_t("Eliminar tarea")}</button>`:""}</div></div>`;
  return h}
function readWhen(){const g=id=>document.getElementById(id),f=g("w_freq").value,w={freq:f};
  if(f==="interval"){w.every=Number(g("w_every")?.value||30);w.unit=g("w_unit")?.value||"min"}
  if(g("w_time"))w.time=g("w_time").value||"04:00";
  if(f==="weekly")w.days=[...document.querySelectorAll(".days button[aria-pressed=true]")].map(b=>Number(b.dataset.d));
  if(f==="monthly")w.day=Number(g("w_day")?.value||1);
  if(f==="monthly_nth"){w.nth=Number(g("w_nth")?.value||1);w.dow=Number(g("w_dow")?.value||0)}
  if(f==="cron")w.cron=(g("w_cron")?.value||"").trim();
  return w}
function wChange(i){const t=TK.tasks[i],old=readWhen(),f=old.freq;
  const defaults={interval:{every:t.type==="check"?30:24,unit:t.type==="check"?"min":"h"},daily:{},weekly:{days:[0]},monthly:{day:1},monthly_nth:{nth:2,dow:0},cron:{cron:"0 4 * * *"}};
  t.when={...defaults[f],freq:f,time:old.time||(t.when&&t.when.time)||"04:00"};
  renderTasks()}
let _wp=0;
async function wPreview(i){const el=$("#w_prev");if(!el)return;const n=++_wp;
  const r=await api("/api/when-preview",{method:"POST",body:{when:readWhen()}}).catch(e=>({valid:false,error:e.message}));
  if(n!==_wp)return;
  el.innerHTML=r.valid?`<b>${esc(r.describe)}</b> · ${_t("próximas:")} ${r.next_h.map(esc).join(" · ")}`:`<span style="color:var(--crit-ink)">${esc(r.error||_t("Horario inválido"))}</span>`}
function editTask(i){EDIT=i;renderTasks();if(i!==null)document.getElementById("task-"+i)?.scrollIntoView({block:"nearest",behavior:"smooth"})}
function addTask(type){
  const base={id:type+"-"+Math.random().toString(36).slice(2,7),type,enabled:true,targets:[],next:[],describe:"",last:null};
  const t={smart:{test:"short",notify_ok:false,when:{freq:"weekly",days:[3],time:"04:00"}},scrub:{notify_ok:true,when:{freq:"monthly_nth",nth:2,dow:0,time:"02:00"}},report:{when:{freq:"weekly",days:[1],time:"09:00"}}}[type];
  TK.tasks.push({...base,...t});editTask(TK.tasks.length-1)}
const clean=t=>{const o={id:t.id,type:t.type,enabled:!!t.enabled,when:t.when};if(t.type==="smart"){o.test=t.test;o.notify_ok=!!t.notify_ok;o.targets=t.targets||[]}if(t.type==="scrub"){o.notify_ok=!!t.notify_ok;o.notify_start=t.notify_start!==false;o.targets=t.targets||[]}if(t.name)o.name=t.name;return o};
async function putTasks(list){await api("/api/settings",{method:"PUT",body:{tasks:list.map(clean)}});EDIT=null;await loadTasks(true);if(ST)loadPanelQuiet()}
function loadPanelQuiet(){api("/api/status").then(j=>ST=j).catch(()=>{})}
async function saveTask(i){const t={...TK.tasks[i]};t.when=readWhen();
  if(t.type==="smart"){t.test=$("#t_test").value}
  if(t.type==="smart"||t.type==="scrub"){t.targets=[...document.querySelectorAll("input[data-tg]:checked")].map(x=>x.value);t.notify_ok=$("#t_notify").checked;if($("#t_nstart"))t.notify_start=$("#t_nstart").checked}
  const list=TK.tasks.map((x,k)=>k===i?t:x).filter(x=>x.label||x===t);
  try{await putTasks(list);toast(_t("Tarea guardada"))}catch(e){toast(e.message,6000)}}
async function toggleTask(i,on){const list=TK.tasks.filter(x=>x.label).map(x=>x===TK.tasks[i]?{...x,enabled:on}:x);
  if(!TK.tasks[i].label){TK.tasks[i].enabled=on;return}
  try{await putTasks(list);toast(on?_t("Tarea activada"):_t("Tarea desactivada"))}catch(e){toast(e.message,6000);loadTasks(true)}}
async function delTask(i){const t=TK.tasks[i];if(t.label&&!confirm(_t("¿Eliminar la tarea «{name}»?",{name:t.label})))return;
  try{await putTasks(TK.tasks.filter((x,k)=>k!==i&&x.label));toast(_t("Tarea eliminada"))}catch(e){toast(e.message,6000)}}
async function runTask(id){const t=TK.tasks.find(x=>x.id===id);
  if(t.type==="scrub"&&!confirm(_t("¿Iniciar el scrub ahora? Puede tardar varias horas y los discos estarán más ocupados.")))return;
  if(t.type==="smart"&&t.test==="long"&&!confirm(_t("¿Iniciar la prueba larga ahora? En discos grandes tarda muchas horas.")))return;
  try{await api(`/api/tasks/${encodeURIComponent(id)}/run`,{method:"POST"});toast(_t("Tarea iniciada"));TK.running_task=id;renderTasks();
    const poll=setInterval(async()=>{await loadTasks(true);if(!TK.running_task){clearInterval(poll);const L=TK.tasks.find(x=>x.id===id)?.last;if(L)toast((L.ok?"✓ ":"✕ ")+L.msg,7000)}},2000)}catch(e){toast(e.message,6000)}}
async function saveSys(){try{await api("/api/settings",{method:"PUT",body:{discovery_minutes:Number($("#disc_min").value),skip_standby:$("#skip_standby").checked}});toast(_t("Guardado"))}catch(e){toast(e.message,6000)}}

// ------------------------------------------------------------------ arranque
async function setLanguage(l){if(l===LANG)return;try{await api("/api/settings",{method:"PUT",body:{language:l}});setLang(l);location.reload()}catch(e){toast(e.message,6000)}}
(async()=>{const hj=await fetch("/health").then(r=>r.json()).catch(()=>({}));
  if(hj.version)$("#ver").textContent="v"+hj.version;
  setLang(hj.language);document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));tStatic();
  try{CFG=(await api("/api/settings")).settings}catch(e){}
  const h=(location.hash||"").slice(1);show(["panel","alerts","tasks","log","cfg"].includes(h)?h:"panel");
  if(h.startsWith("disk="))openDisk(decodeURIComponent(h.slice(5))).catch(e=>toast(e.message));
  setInterval(()=>{if(VIEW==="panel"&&!dlg.open&&document.visibilityState==="visible")loadPanel()},60000);
  setInterval(()=>{if(VIEW==="tasks"&&EDIT===null&&document.visibilityState==="visible")loadTasks(true)},8000);})();
</script></body></html>
