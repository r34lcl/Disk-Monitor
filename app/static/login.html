<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disk Monitor</title><link rel="icon" href="/favicon.svg">
<style>
:root{color-scheme:light dark;--bg:#F1F5F9;--card:#FFFFFF;--text:#0F172A;--muted:#5B677A;--border:#DDE3EA;--accent:#2563EB;--crit:#b02a2a;--ring:#2563EB}
@media (prefers-color-scheme:dark){:root{--bg:#0F172A;--card:#1B2336;--text:#F8FAFC;--muted:#94A3B8;--border:#334155;--crit:#F87171;--ring:#93C5FD}}
:is(input,button):focus-visible{outline:2px solid var(--ring);outline-offset:2px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:340px}
h1{font-size:19px;margin:0 0 18px;display:flex;gap:10px;align-items:center}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:transparent;color:inherit;font:inherit}
.row{display:flex;gap:8px;align-items:center;margin:14px 0;font-size:14px}
button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#err{color:var(--crit);font-size:14px;min-height:20px;margin-top:10px}
body{grid-template-rows:1fr auto}
footer{text-align:center;font-size:12.5px;color:var(--muted);padding-top:24px}footer a{color:inherit;text-decoration:none;font-weight:600}footer a:hover{text-decoration:underline}
</style></head><body>
<form id="f"><h1><img src="/favicon.svg" width="26" alt="">Disk Monitor</h1>
<label for="u">Usuario</label><input id="u" type="text" autocomplete="username" value="admin" required>
<label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required autofocus>
<div class="row"><input id="r" type="checkbox" checked><label for="r" style="margin:0;color:inherit">Recordarme 30 días</label></div>
<button>Entrar</button><div id="err"></div></form>
<footer>Disk Monitor <span id="ver"></span> · <a href="https://kqk.cl" target="_blank" rel="noopener">KqK.cl</a></footer>
<script>
fetch("/health").then(r=>r.json()).then(j=>{if(j.version)document.getElementById("ver").textContent="v"+j.version}).catch(()=>{});
f.onsubmit=async e=>{e.preventDefault();err.textContent="";
const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value,remember:document.getElementById("r").checked})});
if(r.ok)location.href="/";else err.textContent=(await r.json().catch(()=>({}))).detail||"Error";};
</script></body></html>
